const PLAIN_MODELS = Object.freeze({
  芽衣: 'May_JK/May_JK.model3.json',
  克雷塔: 'Creta_JK/Creta_JK.model3.json',
});

const PLAIN_FIELDS = ['上衣', '下装', '袜子', '鞋子', '配饰', '发型'];
const NON_PLAIN = /内衣|赤裸|裸体|裸露|脱光|脱下|脱掉|开档|开裆|体液|精液|乳房|性器|阴部|后穴/;
const MOODS = ['平常', '微笑', '坏笑', '大笑', '不悦', '生气', '惊讶', '为难', '害羞', '半哭', '流泪'];
const SCENES = ['日常', '店里', '学校', '街上'];

function textValue(value, fallback = '—') {
  return typeof value === 'string' && value.trim() ? value.trim() : fallback;
}

function numberValue(value, fallback = 0) {
  if (value === null || value === undefined || value === '') return fallback;
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : fallback;
}

function plainClothing(value) {
  return PLAIN_FIELDS.flatMap(key => {
    const text = textValue(value?.[key], '');
    return text && !NON_PLAIN.test(text) ? [{ key, value: text }] : [];
  });
}

function projectState(raw = {}) {
  const context = raw?.当前处境 ?? {};
  const time = context.时间 ?? {};
  const scene = context.场景 ?? {};
  const relationship = context.关系 ?? {};
  const character = (name, innerKey) => {
    const source = raw?.[name] ?? {};
    return {
      name,
      mood: MOODS.includes(source.心情) ? source.心情 : '平常',
      inner: textValue(source.状态栏文本?.[innerKey], '此刻，思绪还未落成文字。'),
      clothing: plainClothing(source.着装),
      model: PLAIN_MODELS[name],
    };
  };
  return {
    date: textValue(time.日期, '日期待更新'),
    time: textValue(time.时刻, '--:--'),
    season: textValue(time.季节, '季节待更新'),
    place: textValue(scene.地点, '地点待更新'),
    scene: SCENES.includes(scene.场景类型) ? scene.场景类型 : '当前场景',
    present: Array.isArray(scene.在场人物) ? scene.在场人物.filter(x => typeof x === 'string' && x.trim()) : [],
    relationship: textValue(relationship.关系阶段, '关系待更新'),
    identity: textValue(relationship.克雷塔身份阶段, '身份待更新'),
    intimacy: Math.round(Math.min(100, Math.max(0, numberValue(relationship.亲密度)))),
    savings: numberValue(raw?.克雷塔?.存款),
    people: [character('芽衣', '内心独白'), character('克雷塔', '心声')],
  };
}

function createMessageStore(Vue, defineStore, messageId) {
  return defineStore(`mei_statusbar.message.${messageId}`, () => {
    const data = Vue.shallowRef(projectState());
    const ready = Vue.ref(false);
    const error = Vue.ref('');
    let lastSnapshot = '';
    const read = () => {
      try {
        const variables = getVariables({ type: 'message', message_id: messageId });
        const raw = variables?.stat_data;
        if (!raw || typeof raw !== 'object') {
          error.value = '正在等待本条消息的状态数据…';
          return;
        }
        const next = projectState(raw);
        const serialized = JSON.stringify(next);
        if (serialized !== lastSnapshot) {
          data.value = next;
          lastSnapshot = serialized;
        }
        ready.value = true;
        error.value = '';
      } catch {
        error.value = '状态数据暂时不可用，界面会自动重试。';
      }
    };
    read();
    const timer = setInterval(read, 2000);
    Vue.onScopeDispose(() => clearInterval(timer));
    return { data, ready, error };
  });
}


const ASSET_COMMIT = '907bc77b46ce9765c66bd2a06d01c57efcf5a894';
const ASSET_BASE = `https://testingcf.jsdelivr.net/gh/shizakikanon1/mei-statusbar@${ASSET_COMMIT}/live2d/`;
const RUNTIMES = [
  'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js',
  'https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js',
  'https://cdn.jsdelivr.net/npm/pixi-live2d-display-lipsyncpatch@0.5.0-ls-8/dist/cubism4.min.js',
];
const EXPRESSIONS = {
  微笑: ['優しく微笑', '微笑'], 坏笑: ['ヤンデレ笑', 'ヤンデレニコリ'],
  大笑: ['口開けて笑う'], 不悦: ['ムスッとする'], 生气: ['怒る'],
  惊讶: ['びっくり'], 为难: ['困り笑い', '困る'], 害羞: ['ハニカミ'],
  半哭: ['半泣き'], 流泪: ['涙を流す'],
};

function stageGeometry(width, height, modelWidth, modelHeight, index) {
  const cellWidth = width / 2;
  const usableHeight = Math.max(1, height - 28);
  return {
    scale: Math.min(usableHeight / Math.max(1, modelHeight), cellWidth * 0.88 / Math.max(1, modelWidth)),
    x: width * (index === 0 ? 0.25 : 0.75),
    y: height - 12,
  };
}

function loadRuntimeScript(url) {
  return new Promise((resolve, reject) => {
    let tag = document.querySelector(`script[data-mei-runtime="${url}"]`);
    if (tag?.dataset.loaded === '1') return resolve();
    // Remove only a previous failed runtime tag so a retry can actually reload it.
    if (tag?.dataset.failed === '1') { tag.remove(); tag = null; }
    const fresh = !tag;
    tag ??= document.createElement('script');
    const timeout = setTimeout(() => finish(new Error('运行库加载超时')), 20000);
    const onLoad = () => { tag.dataset.loaded = '1'; finish(); };
    const onError = () => { tag.dataset.failed = '1'; finish(new Error('运行库加载失败')); };
    function finish(error) {
      clearTimeout(timeout);
      tag.removeEventListener('load', onLoad);
      tag.removeEventListener('error', onError);
      if (error) { tag.dataset.failed = '1'; reject(error); } else resolve();
    }
    tag.addEventListener('load', onLoad, { once: true });
    tag.addEventListener('error', onError, { once: true });
    if (fresh) {
      tag.src = url;
      tag.dataset.meiRuntime = url;
      document.head.appendChild(tag);
    }
  });
}

function ensureRuntime() {
  const runtime = window.__MEI_L2D_RUNTIME__;
  if (runtime) return runtime;
  const promise = RUNTIMES.reduce((chain, url) => chain.then(() => loadRuntimeScript(url)), Promise.resolve());
  window.__MEI_L2D_RUNTIME__ = promise;
  promise.catch(() => {
    if (window.__MEI_L2D_RUNTIME__ === promise) window.__MEI_L2D_RUNTIME__ = null;
  });
  return promise;
}

// Preserve the deployed normal-motion reset. Models are hidden until reset finishes.
async function resetNormalPose(model, timers) {
  const manager = model.internalModel?.motionManager;
  if (!manager) return;
  const definitions = manager.definitions ?? {};
  let normal;
  for (const [group, motions] of Object.entries(definitions)) {
    const index = motions.findIndex(motion =>
      String(motion?.File ?? '').split('/').pop().replace(/^■/, '').replace(/\.motion3\.json$/, '') === '通常');
    if (index >= 0) { normal = { group, index }; break; }
  }
  if (normal) {
    await model.motion(normal.group, normal.index, 3);
    await new Promise(resolve => {
      const timer = setTimeout(() => { timers.delete(timer); resolve(); }, 1200);
      timers.set(timer, resolve);
    });
  }
  manager.stopAllMotions?.();
  if (manager.groups) manager.groups.idle = undefined;
}

function applyMood(model, mood) {
  const manager = model.internalModel?.motionManager?.expressionManager;
  // Reset old expressions as well as selecting the new one (including 平常).
  manager?.resetExpression?.();
  const names = (model.internalModel?.settings?.expressions ?? []).map(x => x.Name ?? x.name).filter(Boolean);
  const expression = (EXPRESSIONS[mood] ?? []).map(fragment => names.find(name => name.includes(fragment))).find(Boolean);
  if (expression) Promise.resolve(model.expression(expression)).catch(() => {});
}

function createLive2DStage(Vue) {
  const { h, defineComponent, ref, onMounted, onBeforeUnmount, watch } = Vue;
  return defineComponent({
    name: 'Live2DStage',
    props: { actors: { type: Array, required: true } },
    setup(props) {
      const canvas = ref(null);
      const status = ref('loading');
      const note = ref('正在点亮人物舞台…');
      let app, observer;
      let disposed = false;
      let revision = 0;
      const models = new Map();
      const timers = new Map();

      function fit() {
        const container = canvas.value?.parentElement;
        if (!container || !app) return;
        const width = Math.max(1, container.clientWidth);
        const height = Math.max(1, container.clientHeight);
        app.renderer.resize(width, height);
        for (const [index, model] of models) {
          const geometry = stageGeometry(width, height,
            model.internalModel?.width ?? 1300, model.internalModel?.height ?? 2160, index);
          model.scale.set(geometry.scale);
          model.anchor?.set?.(0.5, 1);
          model.position.set(geometry.x, geometry.y);
        }
      }

      function clearModels() {
        for (const model of models.values()) {
          try { app?.stage.removeChild(model); model.destroy(); } catch {}
        }
        models.clear();
      }

      async function loadModels() {
        if (!app || disposed) return;
        const current = ++revision;
        clearModels();
        status.value = 'loading';
        note.value = '正在点亮人物舞台…';
        let failed = 0;
        for (let index = 0; index < props.actors.length; index++) {
          const actor = props.actors[index];
          let model;
          try {
            // Only the ordinary-outfit model allowlist is accepted, including on retries.
            if (actor.model !== PLAIN_MODELS[actor.name]) throw new Error('Unknown model');
            model = await window.PIXI.live2d.Live2DModel.from(ASSET_BASE + actor.model,
              { autoHitTest: false, autoFocus: false, motionPreload: 'NONE' });
            if (disposed || revision !== current) { model.destroy(); return; }
            model.visible = false;
            app.stage.addChild(model);
            models.set(index, model);
            fit();
            await resetNormalPose(model, timers);
            if (disposed || revision !== current) return;
            applyMood(model, props.actors[index]?.mood ?? '平常');
            model.visible = true;
          } catch {
            failed++;
            if (model) {
              models.delete(index);
              try { app?.stage.removeChild(model); model.destroy(); } catch {}
            }
          }
        }
        if (disposed || revision !== current) return;
        fit();
        status.value = failed ? 'failed' : 'ready';
        note.value = models.size ? '部分人物暂未加载，文字信息仍可阅读。' : '人物暂未加载，文字信息仍可阅读。';
      }

      async function start() {
        status.value = 'loading';
        note.value = '正在点亮人物舞台…';
        try {
          await ensureRuntime();
          if (disposed) return;
          if (!app) {
            const parent = canvas.value.parentElement;
            app = new window.PIXI.Application({
              view: canvas.value, width: parent.clientWidth || 1, height: parent.clientHeight || 1,
              backgroundAlpha: 0, antialias: true, autoStart: true,
              resolution: Math.min(window.devicePixelRatio || 1, 2), autoDensity: true,
            });
            observer = new ResizeObserver(fit);
            observer.observe(parent);
          }
          await loadModels();
        } catch {
          if (!disposed) {
            status.value = 'failed';
            note.value = '人物运行库暂不可用，文字信息仍可阅读。';
          }
        }
      }

      onMounted(start);
      watch(() => props.actors.map(x => x.model).join('|'), () => { if (app) loadModels(); });
      watch(() => props.actors.map(x => x.mood).join('|'), () => {
        for (const [index, model] of models) applyMood(model, props.actors[index]?.mood ?? '平常');
      });
      onBeforeUnmount(() => {
        disposed = true;
        revision++;
        observer?.disconnect();
        for (const [timer, resolve] of timers) { clearTimeout(timer); resolve(); }
        timers.clear();
        clearModels();
        try { app?.destroy(true, { children: true }); } catch {}
        app = null;
      });

      return () => h('div', { class: 'l2d', 'data-status': status.value }, [
        h('canvas', { ref: canvas, class: 'l2d__canvas', 'aria-label': '芽衣与克雷塔的普通着装立绘' }),
        status.value !== 'ready' ? h('div', { class: 'l2d__note', role: 'status' }, [
          h('span', note.value),
          status.value === 'failed' ? h('button', { type: 'button', onClick: start, class: 'retry' }, '重试立绘') : null,
        ]) : null,
      ]);
    },
  });
}

                { role: 'progressbar', 'aria-label': '亲密度', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': data.intimacy }),
              el('span', 'meter__value', [el('b', '', String(data.intimacy)), el('small', '', '/ 100')]),

            el('div', 'portrait-stage', [
              el('div', 'portrait-stage__halo portrait-stage__halo--mei', null, { 'aria-hidden': 'true' }),

            el('p', 'voice__text', person.inner),

function bindFrameHeight() {
  let frame;
  try { frame = window.frameElement; } catch { return () => {}; }
  const app = document.querySelector('#app');
  if (!frame || !app) return () => {};
  let pending = null;
  const resize = () => {
    if (pending !== null) return;
    pending = requestAnimationFrame(() => {
      pending = null;
      const height = Math.ceil(app.getBoundingClientRect().height);
      try {
        frame.style.height = `${height}px`;
        frame.style.minHeight = `${height}px`;
        frame.setAttribute('scrolling', 'no');
      } catch {}
    });
  };
  const observer = new ResizeObserver(resize);
  observer.observe(app);
  window.addEventListener('resize', resize, { passive: true });
  resize();
  return () => { observer.disconnect(); window.removeEventListener('resize', resize); if (pending !== null) cancelAnimationFrame(pending); };
}

async function mountStatusbar(Vue, createPinia, defineStore) {
  const host = document.getElementById('app');
  try {
    window.__MEI_STATUSBAR_INSTANCE__?.dispose();
    if (!Vue?.createApp || typeof getVariables !== 'function' || typeof getCurrentMessageId !== 'function') {
      throw new Error('请在已启用酒馆助手与 MVU 的消息界面中加载状态栏。');
    }
    const messageId = getCurrentMessageId();
    const useStore = createMessageStore(Vue, defineStore, messageId);
    const component = createStatusbarApp(Vue, useStore, createLive2DStage(Vue));
    const app = Vue.createApp(component);
    app.use(createPinia());
    app.mount(host);
    const disposeHeight = bindFrameHeight();
    const dispose = () => { disposeHeight(); app.unmount(); window.removeEventListener('pagehide', dispose); };
    window.__MEI_STATUSBAR_INSTANCE__ = { dispose };
    window.addEventListener('pagehide', dispose, { once: true });
  } catch (error) {
    const notice = document.createElement('p');
    notice.className = 'boot-error';
    notice.textContent = error?.message || '状态栏暂时无法加载，请刷新消息后重试。';
    host?.replaceChildren(notice);
    bindFrameHeight();
  }
}

(async () => {
  try {
    const { createPinia, defineStore } = await import('https://testingcf.jsdelivr.net/npm/pinia@3.0.4/+esm');
    await mountStatusbar(window.Vue, createPinia, defineStore);
  } catch {
    const host = document.getElementById('app');

    notice.className = 'boot-error';
    notice.textContent = '状态栏运行库暂时无法加载，请检查网络后刷新消息。';
    host?.replaceChildren(notice);
    bindFrameHeight();
  }
})();</script></body>
